seed: 42

data:
  raw_path: data/raw/aruba.txt
  processed_csv: data/processed/aruba_events.csv
  windows_npz: data/processed/aruba_windows.npz
  mappings_json: data/processed/mappings.json
  split_unit: week
  train_ratio: 0.70
  val_ratio: 0.15
  max_window: 100
  short_window: 20
  medium_window: 50
  long_window: 100
  step_size: 1
  keep_other: true
  other_label: Other
  delta_clip_seconds: 21600
  gap_bins_seconds: [1, 5, 30, 120, 600, 3600]
  room_map_json: config/room_map_aruba.json

model:
  event_embedding_dim: 48
  type_embedding_dim: 8
  room_embedding_dim: 8
  state_embedding_dim: 4
  time_projection_dim: 16
  model_dim: 96
  ssm_hidden_dim: 64
  branch_output_dim: 128
  dropout: 0.30
  use_semantics: true
  use_time_decay: true
  use_multiscale: true
  use_auxiliary_tasks: true

training:
  num_epochs: 120
  batch_size: 128
  pretrain_epochs: 3
  finetune_epochs: 8
  learning_rate: 0.0005
  patience: 8
  activity_loss_weight: 1.0
  next_event_loss_weight: 0.20
  gap_loss_weight: 0.10
  focal_gamma: 2.0
  effective_num_beta: 0.9999

evaluation:
  latency_runs: 300
